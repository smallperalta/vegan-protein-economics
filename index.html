<script>

fetch('data/protein_foods.csv')
.then(response => response.text())
.then(csv => {

  const rows = csv.split('\n').slice(1)

  const categoriesSet = new Set()
  const dataByCategory = {}

  // Parse CSV and group by category
  rows.forEach(r => {
    if(!r.trim()) return
    const c = r.split(';')
    const product = c[0]
    const category = c[1]
    const protein100 = parseFloat(c[5])
    const pricePerProtein = parseFloat(c[6])

    categoriesSet.add(category)

    if(!dataByCategory[category]){
      dataByCategory[category] = {x:[], y:[], text:[], markerSize:[]}
    }

    dataByCategory[category].x.push(protein100)
    dataByCategory[category].y.push(pricePerProtein)
    dataByCategory[category].text.push(product)

    // Scale marker size: sqrt or linear
    dataByCategory[category].markerSize.push(Math.sqrt(protein100)*3)
  })

  const categories = Array.from(categoriesSet)

  // Predefined bright colors
  const colors = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'
  ]

  // Create traces
  const traces = categories.map((cat, i) => {
    return {
      x: dataByCategory[cat].x,
      y: dataByCategory[cat].y,
      text: dataByCategory[cat].text,
      mode: 'markers',
      type: 'scatter',
      name: cat,
      marker: {
        size: dataByCategory[cat].markerSize,
        color: colors[i % colors.length],
        line: {width:1, color:'black'}
      },
      visible: true,
      hovertemplate:
        "<b>%{text}</b><br>" +
        "Protein: %{x} g / 100g<br>" +
        "Price: %{y} € per 100g protein<extra></extra>"
    }
  })

  // Build filter buttons
  const buttons = categories.map((cat, i) => {
    const visibility = categories.map((_, j) => j === i)
    return {
      method: 'update',
      label: cat,
      args: [{visible: visibility}, {title: `Category: ${cat}`}]
    }
  })

  buttons.unshift({
    method: 'update',
    label: 'All',
    args: [{visible: categories.map(_=>true)}, {title: 'Protein density vs price'}]
  })

  const layout = {
    title: {text:"Protein density vs price", x:0.5},
    xaxis:{
      title:{
        text:"Protein (g per 100g)",
        standoff: 15
      },
      zeroline:false
    },
    yaxis:{
      title:{
        text:"Price (€ per 100g protein)",
        standoff: 15
      },
      zeroline:false
    },
    hovermode:"closest",
    updatemenus: [{
      buttons: buttons,
      direction: "down",
      showactive: true,
      x:1.05,
      xanchor:"left",
      y:1
    }],
    legend:{x:1.05, y:0.8}
  }

  Plotly.newPlot('chart', traces, layout)

})

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vegan Protein Economics - Categories</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #chart { width: 100%; height: 600px; }
    .subtitle { color: #666; font-size: 0.9em; margin-top: -10px; }
  </style>
</head>
<body>

<h1>Vegan Protein Economics</h1>
<p>Protein density vs price (with categories)</p>

<div id="chart"></div>

<script>
fetch('data/protein_foods.csv')
.then(response => response.text())
.then(csv => {

  const rows = csv.split('\n').slice(1)
  const categoriesSet = new Set()
  const dataByCategory = {}

  rows.forEach(r => {
    if(!r.trim()) return
    const c = r.split(';')
    const product = c[0]
    const category = c[1]
    const protein100 = parseFloat(c[5])
    const pricePerProtein = parseFloat(c[6])
    const pricePerKg = parseFloat(c[4])
    if(isNaN(protein100) || isNaN(pricePerProtein) || isNaN(pricePerKg)) return

    categoriesSet.add(category)

    if(!dataByCategory[category]) {
      dataByCategory[category] = {x:[], y:[], text:[], size:[], pricePerKg:[]}
    }

    dataByCategory[category].x.push(protein100)
    dataByCategory[category].y.push(pricePerProtein)
    dataByCategory[category].text.push(product)
    dataByCategory[category].size.push(pricePerKg)
    dataByCategory[category].pricePerKg.push(pricePerKg)
  })

  const categories = Array.from(categoriesSet)

  const colors = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'
  ]

  // Compute averages for reference lines
  let allX = [], allY = []
  categories.forEach(cat => {
    allX = allX.concat(dataByCategory[cat].x)
    allY = allY.concat(dataByCategory[cat].y)
  })
  const avgX = allX.reduce((a,b) => a+b, 0) / allX.length
  const avgY = allY.reduce((a,b) => a+b, 0) / allY.length

  // Scale marker sizes by price_per_kg_eur
  const allPricePerKg = categories.flatMap(cat => dataByCategory[cat].pricePerKg)
  const minPPK = Math.min(...allPricePerKg), maxPPK = Math.max(...allPricePerKg)
  function scaleSize(p) {
    return 8 + 22 * Math.sqrt((p - minPPK) / (maxPPK - minPPK))
  }

  const traces = categories.map((cat, i) => ({
    x: dataByCategory[cat].x,
    y: dataByCategory[cat].y,
    text: dataByCategory[cat].text,
    mode: 'markers',
    type: 'scatter',
    name: cat,
    marker: {
      color: colors[i % colors.length],
      size: 10,
      //size: dataByCategory[cat].size.map(scaleSize),
      opacity: 0.85,
      line: {width:1, color:'black'}
    },
    hovertemplate:
      "<b>%{text}</b><br>" +
      "Protein: %{x} g / 100g<br>" +
      "Price: %{y} € / 100g protein<br>" +
      "Shelf price: €%{customdata} / kg<extra></extra>",
    customdata: dataByCategory[cat].pricePerKg
  }))

  // Category isolation on legend click
  const allXRange = [Math.min(...allX) * 0.95, Math.max(...allX) * 1.05]
  const allYRange = [Math.min(...allY) * 0.95, Math.max(...allY) * 1.05]

  let activeCategory = null

  const layout = {
    title: {text:"Protein density vs price", x:0.5},
    xaxis: {
      title:{text:"Protein (g per 100g)", standoff:15},
      zeroline:false,
      gridcolor:'#eee',
      showline:true, linecolor:'#333', linewidth:1, mirror:true,
      range: allXRange,
      autorange: false
    },
    yaxis: {
      title:{text:"Price (€ per 100g protein)", standoff:15},
      zeroline:false,
      gridcolor:'#eee',
      showline:true, linecolor:'#333', linewidth:1, mirror:true,
      range: allYRange,
      autorange: false
    },
    hovermode:"closest",
    legend:{x:1.05, y:0.5},
    plot_bgcolor: '#fff',
    shapes: [
      {
        type:'line', xref:'x', yref:'paper',
        x0:avgX, x1:avgX, y0:0, y1:1,
        line:{color:'#aaa', width:1, dash:'dot'}
      },
      {
        type:'line', xref:'paper', yref:'y',
        x0:0, x1:1, y0:avgY, y1:avgY,
        line:{color:'#aaa', width:1, dash:'dot'}
      },
      {
        type:'rect', xref:'x', yref:'y',
        x0:avgX, x1: Math.max(...allX) * 1.05,
        y0:0, y1:avgY,
        fillcolor:'rgba(44,160,44,0.08)',
        line:{width:0}
      }
    ],
    annotations: [
      {
        xref:'paper', yref:'paper',
        x:0.98, y:0.02,
        text:'★ Best value zone',
        showarrow:false,
        font:{color:'#2ca02c', size:11},
        xanchor:'right'
      }
    ]
  }

  Plotly.newPlot('chart', traces, layout, {responsive: true})

  // Custom legend click: isolate category, click again to reset
  document.getElementById('chart').on('plotly_legendclick', e => {
    const clicked = e.data[e.curveNumber].name

    if(activeCategory === clicked) {
      // Reset to all visible
      activeCategory = null
      Plotly.restyle('chart', {visible: true})
      Plotly.relayout('chart', {
        'xaxis.range': allXRange,
        'xaxis.autorange': false,
        'yaxis.range': allYRange,
        'yaxis.autorange': false
      })
    } else {
      // Isolate clicked category
      activeCategory = clicked
      const visibility = traces.map(t => t.name === clicked ? true : 'legendonly')
      Plotly.restyle('chart', {visible: visibility})
      Plotly.relayout('chart', {
        'xaxis.range': allXRange,
        'xaxis.autorange': false,
        'yaxis.range': allYRange,
        'yaxis.autorange': false
      })
    }
    return false // prevent default toggle
  })

})
</script>

</body>
</html>

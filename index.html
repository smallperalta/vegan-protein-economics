<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vegan Protein Economics - Categories</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #chart { width: 100%; height: 600px; }
  </style>
</head>
<body>

<h1>Vegan Protein Economics</h1>
<p>Protein density vs price (with categories)</p>

<div id="chart"></div>

<script>
fetch('data/protein_foods.csv')
.then(response => response.text())
.then(csv => {

  const rows = csv.split('\n').slice(1)
  const categoriesSet = new Set()
  const dataByCategory = {}

  // Parse CSV and group by category
  rows.forEach(r => {
    if(!r.trim()) return
    const c = r.split(';')
    const product = c[0]
    const category = c[1]
    const protein100 = parseFloat(c[5])
    const pricePerProtein = parseFloat(c[6])
    if(isNaN(protein100) || isNaN(pricePerProtein)) return

    categoriesSet.add(category)

    if(!dataByCategory[category]) {
      dataByCategory[category] = {x:[], y:[], text:[]}
    }

    dataByCategory[category].x.push(protein100)
    dataByCategory[category].y.push(pricePerProtein)
    dataByCategory[category].text.push(product)
  })

  const categories = Array.from(categoriesSet)
  console.log("Categories:", categories)
  console.log("Data by category:", dataByCategory)

  // Color palette
  const colors = [
    '#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd',
    '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'
  ]

  // Build traces
  const traces = categories.map((cat, i) => {
    return {
      x: dataByCategory[cat].x,
      y: dataByCategory[cat].y,
      text: dataByCategory[cat].text,
      mode: 'markers',
      type: 'scatter',
      name: cat,
      marker: {
        color: colors[i % colors.length],
        size: 12,
        line: {width:1, color:'black'}
      },
      visible: true,
      hovertemplate:
        "<b>%{text}</b><br>" +
        "Protein: %{x} g / 100g<br>" +
        "Price: %{y} € / 100g protein<extra></extra>"
    }
  })

  // Build category filter buttons
  const buttons = categories.map((cat, i) => {
    const visibility = categories.map((_, j) => j === i)
    return {
      method: 'update',
      label: cat,
      args: [{visible: visibility}, {title: `Category: ${cat}`}]
    }
  })

  // Add "All" button
  buttons.unshift({
    method: 'update',
    label: 'All',
    args: [{visible: categories.map(_=>true)}, {title: 'Protein density vs price'}]
  })

  const layout = {
    title: {text:"Protein density vs price", x:0.5},
    xaxis: {title:{text:"Protein (g per 100g)", standoff:15}, zeroline:false},
    yaxis: {title:{text:"Price (€ per 100g protein)", standoff:15}, zeroline:false},
    hovermode:"closest",
    updatemenus: [{
      buttons: buttons,
      direction: "down",
      showactive: true,
      x:1.05,
      xanchor:"left",
      y:1
    }],
    legend:{x:1.05, y:0.8}
  }

  Plotly.newPlot('chart', traces, layout)

})
</script>

</body>
</html>
